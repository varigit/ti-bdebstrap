name: Build

on:
  push:
    branches: [ "master", "bookworm_09.02.01.10_var01", "dev", "dev_*"]
  pull_request:
    branches: [ "master", "bookworm_09.02.01.10_var01" ]

  workflow_dispatch:

jobs:
  # Job1: Prepare list of configrations for Job2
  prepare-build:
    runs-on: ubuntu-latest
    outputs:
      builds: ${{ steps.prepare-builds.outputs.builds }}
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Generate builds list
        id: prepare-builds
        run: |
          pip3 install toml-cli
          builds=$(toml get builds --toml-path ./builds.toml | tr -d "[],'" | tr " " "\n" | grep "_var0")
          output_string="["
          for build in ${builds[@]}
          do
            output_string="${output_string}""\"${build}\","
          done
          output_string="${output_string::-1}""]"
          echo "builds=${output_string}" >> $GITHUB_OUTPUT

  # Job2: Actual build job
  build:
    runs-on: ubuntu-latest
    needs: prepare-build
    strategy:
      matrix:
        builds: ${{ fromJson(needs.prepare-build.outputs.builds) }}
    name: ${{ matrix.builds }}
    steps:
      - name: Setup workspace on GitHub-hosted runner using /mnt with more storage
        if: ${{ !contains(runner.labels, 'self-hosted') }}
        run: |
          echo "Redirecting workspace to /mnt/work"
          sudo mkdir -p /mnt/work
          sudo rm -rf "$GITHUB_WORKSPACE"
          sudo ln -s /mnt/work "$GITHUB_WORKSPACE"
          sudo chown -R $USER:$USER /mnt/work

      - name: Checkout
        uses: actions/checkout@v3

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt upgrade
          sudo apt install -y \
              pigz expect pv \
              binfmtc binfmt-support \
              qemu-user qemu-user-static qemu-system-arm \
              debian-archive-keyring bdebstrap \
              build-essential autoconf automake \
              bison flex libssl-dev \
              bc u-boot-tools swig python3-pyelftools \
              gcc-aarch64-linux-gnu \
              gpg curl
          sudo apt install --fix-broken
          sudo pip3 install toml-cli
          curl -s --compressed https://texasinstruments.github.io/ti-debpkgs/KEY.gpg | \
              gpg --dearmor | \
              sudo tee /usr/share/keyrings/ti-debpkgs.gpg > /dev/null

      - name: Build ${{ matrix.builds }}
        run: |
          mkdir -p build
          sudo ./build.sh ${{ matrix.builds }}

      - name: Remove unused tar archives
        run: |
          # Drop the unused tarball in build/ to free space for the .wic
          sudo rm build/${{ matrix.builds }}.tar.xz

      - name: Create ${{ matrix.builds }} wic image
        run: |
          sudo ./create-wic.sh ${{ matrix.builds }}

      - name: Upload ${{ matrix.builds }}
        if: ${{ github.event.repository.private == false }}
        uses: actions/upload-artifact@v5.0.0
        with:
          path: build/${{ matrix.builds }}/*.wic.zst
          name: ${{ matrix.builds }}
          if-no-files-found: error

      - name: Upload ${{ matrix.builds }}.log
        if: ${{ github.event.repository.private == false }}
        uses: actions/upload-artifact@v5.0.0
        with:
          path: logs/${{ matrix.builds }}.log
          name: ${{ matrix.builds }}.log
          if-no-files-found: error
